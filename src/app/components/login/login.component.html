<div class="auth-container">
    <div class="auth-card glass-panel">

        <div class="auth-header">
            <a routerLink="/" class="logo" style="text-decoration: none;">
                <span class="logo-icon">🎓</span>
                <span class="logo-text">SmartStudy</span>
            </a>
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Log in to resume your courses and AI study sessions.</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">

            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <span class="input-icon">✉️</span>
                    <input type="email" id="email" formControlName="email" placeholder="student@example.com" />
                </div>
                <small *ngIf="submitted && f['email'].errors" class="error-text">Email valide requis</small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" formControlName="password" placeholder="Min. 8 characters" />
                </div>
                <small *ngIf="submitted && f['password'].errors" class="error-text">8 caractères minimum</small>
            </div>

            <div class="form-actions">
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Log In
            </button>

            <div class="auth-footer">
                <p>Don't have an account? <a routerLink="/signup" class="auth-link">Sign up</a></p>
            </div>

        </form>
    </div>

    <div class="bg-glow blob-1"></div>
    <div class="bg-glow blob-2"></div>
</div>
