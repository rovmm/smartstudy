<div class="auth-page">
  <div class="auth-bg-effects">
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
  </div>

  <div class="auth-card glass-card animate-fadeInUp" id="login-card">
    <div class="auth-header">
      <span class="auth-icon"> </span>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to continue your learning journey</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form" id="login-form">
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <div class="input-wrapper">
          <span class="material-icons-round input-icon">email</span>
          <input
            type="email"
            id="login-email"
            class="form-input with-icon"
            placeholder="you@example.com"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <div class="input-wrapper">
          <span class="material-icons-round input-icon">lock</span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="login-password"
            class="form-input with-icon"
            placeholder="Enter your password"
            [(ngModel)]="password"
            name="password"
            required
          />
          <button type="button" class="password-toggle" (click)="togglePasswordVisibility()">
            <span class="material-icons-round">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <div class="form-actions">
        <label class="remember-me">
          <input type="checkbox" name="remember" />
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-glow btn-lg full-width" id="login-submit">
        <span class="material-icons-round">login</span> Sign In
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/signup" class="auth-link">Sign Up</a></p>
    </div>

    <div class="demo-login-section" style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem; text-align: center;">
      <p style="font-size: 0.8rem; letter-spacing: 1px; color: var(--text-secondary); margin-bottom: 1rem;"> </p>
      <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
        <button type="button" class="btn btn-secondary btn-sm" (click)="demoLogin('admin')">Admin</button>
        <button type="button" class="btn btn-secondary btn-sm" (click)="demoLogin('professor')">Professor</button>
        <button type="button" class="btn btn-secondary btn-sm" (click)="demoLogin('student')">Student</button>
      </div>
      <p *ngIf="loginError" style="color: #ef4444; margin-top: 8px; font-size: 0.85rem;">Login failed.</p>
    </div>
  </div>
</div>
