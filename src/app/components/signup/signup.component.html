<div class="auth-page">
  <div class="auth-bg-effects">
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
  </div>

  <div class="auth-card glass-card animate-fadeInUp" id="signup-card">
    <div class="auth-header">
      <span class="auth-icon"> </span>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join SmartStudy and start learning today</p>
    </div>

    <form (ngSubmit)="onSignup()" class="auth-form" id="signup-form">
      <div class="form-group">
        <label class="form-label" for="signup-name">Full Name</label>
        <div class="input-wrapper">
          <span class="material-icons-round input-icon">person</span>
          <input type="text" id="signup-name" class="form-input with-icon"
            placeholder="John Doe" [(ngModel)]="fullName" name="fullName" required />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-email">Email Address</label>
        <div class="input-wrapper">
          <span class="material-icons-round input-icon">email</span>
          <input type="email" id="signup-email" class="form-input with-icon"
            placeholder="you@example.com" [(ngModel)]="email" name="email" required />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-password">Password</label>
        <div class="input-wrapper">
          <span class="material-icons-round input-icon">lock</span>
          <input [type]="showPassword ? 'text' : 'password'" id="signup-password" class="form-input with-icon"
            placeholder="Create a strong password" [(ngModel)]="password" name="password" required />
          <button type="button" class="password-toggle" (click)="togglePassword()">
            <span class="material-icons-round">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-confirm">Confirm Password</label>
        <div class="input-wrapper">
          <span class="material-icons-round input-icon">lock</span>
          <input [type]="showPassword ? 'text' : 'password'" id="signup-confirm" class="form-input with-icon"
            placeholder="Confirm your password" [(ngModel)]="confirmPassword" name="confirmPassword" required />
        </div>
      </div>

      <button type="submit" class="btn btn-glow btn-lg full-width" id="signup-submit">
        <span class="material-icons-round">person_add</span> Create Account
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login" class="auth-link">Sign In</a></p>
    </div>
  </div>
</div>
