<div class="session-wrapper">
  <div *ngIf="!session" class="loading-state">
    <div class="glow-spinner"></div>
  </div>

  <div *ngIf="session" class="session-layout">
    <!-- Sidebar -->
    <div class="glass-panel sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon"><span class="material-icons-round">menu_book</span></div>
          <div class="brand-text">
            <h1>{{ session.title }}</h1>
            <span class="live-status"><span class="material-icons-round" style="font-size:14px">cloud_sync</span> </span>
          </div>
        </div>
        <button class="btn-icon" (click)="leaveSession()" title="Leave Session">
          <span class="material-icons-round">exit_to_app</span>
        </button>
      </div>

      <div class="exercises-container">
        <h2 class="section-title"><span class="material-icons-round" style="font-size: 18px">task</span> Assigned Exercises</h2>
        
        <div class="exercises-list">
          <div *ngFor="let exercise of session.exercises; let i = index" 
               class="exercise-card"
               [class.active]="activeExerciseIndex === i"
               (click)="selectExercise(i)">
            <div class="exercise-header">
              <span class="material-icons-round" style="font-size: 16px">code</span>
              Exercise {{ i + 1 }}
            </div>
            <div class="exercise-body">{{ exercise }}</div>
          </div>
        </div>

        <div *ngIf="!session.isActive" class="alert-box alert-error">
          <span class="material-icons-round">timer_off</span>
          <div class="alert-content">
            <strong>Session Ended</strong>
            <span>No further changes can be tracked.</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Workspace -->
    <div class="workspace">
      <!-- Code Editor -->
      <div class="glass-panel editor-panel">
        <div class="panel-header">
          <div class="tab active">
            <span class="material-icons-round" style="font-size: 18px">terminal</span>
            solution
          </div>
          <button class="btn-run" (click)="executeCode()" [disabled]="isRunning || !session.isActive">
            <span class="material-icons-round" style="font-size: 18px" *ngIf="!isRunning">play_circle</span>
            <span class="glow-spinner small" *ngIf="isRunning"></span>
            {{ isRunning ? 'Executing...' : 'Run Code' }}
          </button>
        </div>
        <div class="editor-wrapper">
          <div #editorContainer class="codemirror-host"></div>
        </div>
      </div>

      <!-- Console -->
      <div class="glass-panel console-panel">
        <div class="panel-header console-header">
          <div class="tab">
            <span class="material-icons-round" style="font-size:18px">dvr</span>
            EXECUTION CONSOLE
          </div>
        </div>
        <div class="console-body">{{ output || 'Waiting for execution...' }}</div>
      </div>
    </div>
  </div>
</div>
