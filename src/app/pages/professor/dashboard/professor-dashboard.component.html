<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="header-content">
      <span class="material-icons-round header-icon">school</span>
      <h1>Professor Dashboard</h1>
    </div>
  </header>

  <main class="dashboard-grid">
    <!-- Create Session Section -->
    <section class="glass-card create-session-card">
      <div class="card-header">
        <span class="material-icons-round card-icon">add_task</span>
        <h2>Create Evaluation</h2>
      </div>
      
      <form (ngSubmit)="onCreateSession()" class="session-form">
        <div class="form-group">
          <label class="form-label">Evaluation Title</label>
          <div class="input-wrapper">
            <span class="material-icons-round input-icon">title</span>
            <input type="text" [(ngModel)]="newSessionTitle" name="title" required class="form-input" placeholder="e.g. Logic Programming 101">
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Exercises</label>
          <div class="exercises-list">
            <div *ngFor="let prompt of newSessionPrompts; let i = index; trackBy: trackByIndex" class="exercise-item">
              <div class="textarea-wrapper">
                <textarea [(ngModel)]="newSessionPrompts[i]" [name]="'prompt' + i" required class="form-input" rows="2" [placeholder]="'Exercise ' + (i + 1) + ' description...'"></textarea>
              </div>
              <button type="button" *ngIf="newSessionPrompts.length > 1" (click)="removeExercise(i)" class="btn-remove" title="Remove Exercise">
                <span class="material-icons-round">delete_outline</span>
              </button>
            </div>
          </div>
          
          <button type="button" (click)="addExercise()" class="btn btn-outline-dashed">
            <span class="material-icons-round">add</span>
            Add Another Exercise
          </button>
        </div>
        
        <button type="submit" class="btn btn-primary btn-glow" [disabled]="!newSessionTitle || isInvalidPrompts()">
          <span class="material-icons-round">rocket_launch</span>
          Create
        </button>
      </form>
    </section>

    <!-- Session History Section -->
    <section class="glass-card history-card">
      <div class="card-header">
        <span class="material-icons-round card-icon">history_edu</span>
        <h2> History</h2>
      </div>
      
      <div class="history-content">
        <div *ngIf="mySessions.length === 0" class="empty-state">
          
          <p>You haven't created any sessions yet.</p>
        </div>

        <div class="session-items">
          <div *ngFor="let session of mySessions" class="session-item-card">
            <div class="session-info">
              <div class="session-title-line">
                <h3>{{ session.title }}</h3>
                <span [class]="'status-badge ' + (session.isActive ? 'status-live' : 'status-closed')">
                  {{ session.isActive ? 'Live' : 'Closed' }}
                </span>
              </div>
              
              <div class="session-meta">
                <div class="meta-item code-badge">
                  <span class="material-icons-round">key</span>
                  <code>{{ session.code }}</code>
                </div>
                <div class="meta-divider"></div>
                <div class="meta-item">
                  <span class="material-icons-round">format_list_numbered</span>
                  <span>{{ session.exercises.length }} Exercises</span>
                </div>
              </div>
            </div>
            
            <div class="session-actions">
              <button class="btn btn-action-primary" (click)="viewSession(session.id)">
                <span>Open</span>
                <span class="material-icons-round">arrow_forward</span>
              </button>
              <button class="btn btn-action-secondary" (click)="duplicateSession(session)">
                <span class="material-icons-round">content_copy</span>
                <span>Duplicate</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
